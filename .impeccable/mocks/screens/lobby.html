<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lobby – big screen</title>
<link rel="stylesheet" href="theme.css">
<style>
.mark { position: absolute; left: 72px; top: 56px; font-size: 120px; font-weight: 800; color: #fff; letter-spacing: -.04em; line-height: .9; }
.mark i { font-style: normal; color: var(--yellow); }
.join { position: absolute; left: 72px; top: 200px; width: 470px; background: var(--card); border-radius: 26px; padding: 34px 36px 38px; box-shadow: 0 18px 34px rgba(0,0,0,.32); }
.join h2 { font-size: 30px; font-weight: 800; }
.join .url { margin-top: 14px; font-family: var(--num); font-size: 25px; white-space: nowrap; font-weight: 800; background: var(--track); border-radius: 12px; padding: 14px 18px; }
.join ol { margin: 24px 0 0; padding-left: 28px; font-size: 24px; font-weight: 600; line-height: 1.5; color: var(--ink-soft); }
.count { position: absolute; left: 72px; top: 610px; color: #fff; font-size: 30px; font-weight: 800; }
.count b { font-family: var(--num); color: var(--gold); font-size: 56px; margin-right: 12px; }
.start { position: absolute; left: 72px; bottom: 64px; font-size: 32px; padding: 22px 44px 30px; }

/* The box insert: one compartment per player. Compartments shrink as the table fills
   (4 columns up to 12 players, then 5, 6, 7, 8), so 30+ players still fit on one screen. */
.tray { position: absolute; left: 600px; right: 72px; top: 56px; bottom: 64px; background: var(--board-deep); border-radius: 28px; padding: 18px; display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-auto-rows: 1fr; gap: var(--gap); align-content: stretch; }
.slot { min-width: 0; background: var(--track); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; }
.slot .face { width: var(--face); height: var(--face); border: calc(var(--face) / 18) solid var(--pc); }
.slot b { font-size: var(--name); font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.empty { background: transparent; border: 3px dashed #5470b8; color: #a9bbe8; font-size: 20px; font-weight: 600; }
.slot.drawing .face { opacity: .45; }
.slot small { font-size: calc(var(--name) * .75); font-weight: 600; color: var(--ink-soft); }
.slot.new { box-shadow: 0 0 0 4px var(--gold); }

/* Names-only mode for big parties (more than 30): faces would get too small to see,
   so every player becomes a name tag with their pawn colour. Fits 80+ on one screen. */
.tray.names { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; }
.tag { display: flex; align-items: center; gap: 10px; background: var(--track); border-radius: 999px; padding: 8px 18px 8px 10px; font-size: var(--name); font-weight: 800; max-width: 100%; }
.tag i { flex: none; width: calc(var(--name) * .9); height: calc(var(--name) * .9); border-radius: 50%; background: var(--pc); }
.tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag.drawing { opacity: .6; }
.tag.new { box-shadow: 0 0 0 4px var(--gold); }
</style></head><body class="big">

<div class="mark">Qvizz<i>.</i></div>
<div class="join">
  <h2>Grab your phone and join</h2>
  <div class="url">192.168.0.12:5080/game</div>
  <ol><li>Pick a nickname</li><li>Draw your face</li><li>Watch this screen</li></ol>
</div>
<div class="count"><b id="n"></b>players at the table</div>
<button class="btn start plastic">Start the game</button>
<div class="tray" id="tray"></div>

<script src="faces.js"></script>
<script>
// Mock data: ?n=30 shows a full party. The real lobby uses the same tiers.
const n = Math.max(1, +(new URLSearchParams(location.search).get('n') || 9));
const names = ['Anna','Peter','Zuzka','Marek','Jana','Tomas','Lucia','Martin','Eva','Juraj','Katarina','Michal','Simona','Ondrej','Barbora',
  'Filip','Natalia','Roman','Veronika','Lukas','Kristina','Adam','Monika','Patrik','Alexandra','Daniel','Ivana','Samuel','Petra','Maximilian','Dominika','Rastislav',
  'Andrea','Boris','Dana','Erik','Gabriela','Henrich','Ingrid','Jakub','Klara','Ladislav','Miriam','Norbert','Olga','Pavol','Renata','Stefan','Tatiana','Viktor',
  'Zdenka','Branislav','Diana','Igor','Lenka','Matej','Nikola','Oliver','Radka','Silvia','Tibor','Vanda'];
const colours = ['#d93a28','#23843a','#0f78b5','#f2b705','#864cbf','#0aa3a3','#e86fa6','#7a4a1d','#3a3a3a','#ff8c1a'];
const tray = document.getElementById('tray');
document.getElementById('n').textContent = n;

if (n > 30) {
  // names only; text shrinks a step for very big parties
  tray.classList.add('names');
  tray.style.cssText += `--name:${n <= 45 ? 30 : n <= 60 ? 24 : 19}px`;
  tray.innerHTML = Array.from({ length: n }, (_, i) => {
    const drawing = i >= n - 2;
    const cls = ['tag', drawing ? 'drawing' : '', i === n - 3 ? 'new' : ''].join(' ');
    return `<div class="${cls}" style="--pc:${colours[i % colours.length]}"><i></i><span>${names[i % names.length]}</span></div>`;
  }).join('');
  throw 'names mode';   // stop here; the face grid below is for 30 or fewer
}

const tiers = [[12, 4, 104, 26, 16], [20, 5, 88, 22, 14], [30, 6, 70, 19, 12]];
const [, cols, face, name, gap] = tiers.find(t => n <= t[0]);
tray.style.cssText += `--cols:${cols};--face:${face}px;--name:${name}px;--gap:${gap}px`;

const faceIds = ['anna','peter','zuzka','marek','jana','tomas'];
let html = '';
for (let i = 0; i < n; i++) {
  const drawing = i >= n - 2 && n > 3;           // the last joiners are still drawing
  const cls = ['slot', drawing ? 'drawing' : '', i === n - 3 ? 'new' : ''].join(' ');
  const fid = i < 6 ? faceIds[i] : 'g' + i;
  html += `<div class="${cls}" style="--pc:${colours[i % colours.length]}"><i class="face" data-face="${fid}"></i><b>${names[i % names.length]}</b>${drawing ? '<small>drawing…</small>' : ''}</div>`;
}
// With a small group, leave inviting empty seats to fill out the rows.
const min = cols * 3;
for (let i = n; i < min; i++) html += '<div class="slot empty">free seat</div>';
tray.innerHTML = html;
tray.querySelectorAll('[data-face]').forEach(el => el.innerHTML = faceSvg(el.dataset.face));
</script>
</body></html>
