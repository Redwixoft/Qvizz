<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Podium – big screen</title>
<link rel="stylesheet" href="theme.css">
<style>
h1 { position: absolute; left: 0; right: 0; top: 56px; text-align: center; font-size: 84px; font-weight: 800; color: #fff; letter-spacing: -.03em; }
.stage { position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; display: flex; align-items: flex-end; gap: 24px; }
.place { width: 300px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.place .face { width: 150px; height: 150px; border: 8px solid #fff; box-shadow: 0 10px 18px rgba(0,0,0,.35); }
.place .p1 .face, .place.p1 .face { width: 190px; height: 190px; }
.place .nm { color: #fff; font-size: 40px; font-weight: 800; }
.block { width: 100%; border-radius: 22px 22px 8px 8px; display: flex; flex-direction: column; align-items: center; padding-top: 22px; gap: 6px; }
.block .pts { font-family: var(--num); font-size: 38px; font-weight: 800; }
.block .medal { width: 92px; height: 110px; }
.p1 .block { height: 300px; background: #f2b705; }
.p2 .block { height: 220px; background: #c9ced8; }
.p3 .block { height: 170px; background: #d08a4e; }
.rest { position: absolute; left: 0; right: 0; bottom: 48px; display: flex; justify-content: center; gap: 14px; }
.rest .pos { font-size: 20px; }
.rest .pos .face { width: 40px; height: 40px; }
.rest .rk { font-family: var(--num); color: var(--ink-soft); }
</style></head><body class="big">
<svg width="0" height="0" style="position:absolute">
  <symbol id="medal" viewBox="0 0 92 110">
    <path d="M22 0h20l12 34H34zM50 0h20L58 34H38z" fill="#1d3e93"/>
    <circle cx="46" cy="70" r="36" fill="currentColor" stroke="#14213d" stroke-width="5"/>
    <circle cx="46" cy="70" r="24" fill="none" stroke="#14213d" stroke-width="3" opacity=".35"/>
  </symbol>
</svg>
<h1>Anna takes the table!</h1>
<div class="stage">
  <div class="place p2"><i class="face" data-face="peter"></i><span class="nm">Peter</span>
    <div class="block"><svg class="medal" style="color:#eef1f6"><use href="#medal"/></svg><span class="pts">1 104</span></div></div>
  <div class="place p1"><i class="face" data-face="anna"></i><span class="nm">Anna</span>
    <div class="block"><svg class="medal" style="color:#ffd36b"><use href="#medal"/></svg><span class="pts">1 230</span></div></div>
  <div class="place p3"><i class="face" data-face="zuzka"></i><span class="nm">Zuzka</span>
    <div class="block"><svg class="medal" style="color:#e9a56c"><use href="#medal"/></svg><span class="pts">986</span></div></div>
</div>
<div class="rest">
  <div class="pos"><span class="rk">4</span><i class="face" data-face="marek"></i><span class="name">Marek</span>870</div>
  <div class="pos"><span class="rk">5</span><i class="face" data-face="jana"></i><span class="name">Jana</span>815</div>
  <div class="pos"><span class="rk">6</span><i class="face" data-face="tomas"></i><span class="name">Tomas</span>640</div>
</div>
<script src="faces.js"></script>
</body></html>
