<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Draw – phone</title>
<link rel="stylesheet" href="theme.css">
<style>
h2 { color: #fff; font-size: 28px; font-weight: 800; text-align: center; margin-top: 6px; }
.hint { color: #c9d6ff; font-size: 16px; font-weight: 600; text-align: center; margin-top: -6px; }
.canvas { align-self: center; width: 330px; height: 330px; background: #fff; border-radius: 24px; box-shadow: 0 10px 18px rgba(0,0,0,.3); padding: 10px; }
.canvas svg { width: 100%; height: 100%; }
.pal { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5); }
.sw.on { border-color: #fff; outline: 3px solid var(--gold); outline-offset: 2px; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tools .btn { font-size: 16px; padding: 10px 6px 14px; }
.tools .btn.sel { box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), 0 0 0 3px var(--gold); }
.done { font-size: 24px; margin-top: auto; }
</style></head><body class="phone">
<h2>Draw your face</h2>
<div class="hint">Eyes, nose, mouth, hair, glasses… go wild.</div>
<div class="canvas"><svg viewBox="0 0 300 300">
  <ellipse cx="150" cy="158" rx="104" ry="124" fill="#fff" stroke="#333" stroke-width="4"/>
  <path d="M60 120q6-90 90-90q84 0 90 90q-30-50-90-50q-60 0-90 50z" fill="#7a4a1d"/>
  <circle cx="112" cy="142" r="10" fill="#222"/><circle cx="188" cy="142" r="10" fill="#222"/>
  <path d="M100 196q50 40 100 0" fill="none" stroke="#e2483a" stroke-width="10" stroke-linecap="round"/>
  <path d="M150 150v30l-10 6" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>
</svg></div>
<div class="pal">
  <i class="sw on" style="background:#222"></i><i class="sw" style="background:#7a4a1d"></i><i class="sw" style="background:#d93a28"></i><i class="sw" style="background:#0f78b5"></i>
  <i class="sw" style="background:#23843a"></i><i class="sw" style="background:#f2b705"></i><i class="sw" style="background:#ff7eb6"></i><i class="sw" style="background:#fff"></i>
</div>
<div class="tools"><button class="btn light plastic sel">Thin</button><button class="btn light plastic">Thick</button><button class="btn light plastic">Undo</button><button class="btn light plastic">Clear</button></div>
<button class="btn done plastic">That's me!</button>
</body></html>
