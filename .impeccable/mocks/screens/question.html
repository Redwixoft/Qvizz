<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Question – big screen</title>
<link rel="stylesheet" href="theme.css">
<style>
body { width: 1440px; height: 900px; background: var(--board); font-family: var(--display); color: var(--ink); position: relative; overflow: hidden; }
/* faint printed board pattern */

.ticker { position: absolute; left: 24px; right: 24px; top: 22px; }
.ticker .pos .face { width: 40px; height: 40px; }
.locked { position: absolute; left: 52px; bottom: 26px; font-size: 22px; font-weight: 600; color: var(--ink-soft); }
.locked b { font-family: var(--num); color: var(--ink); }

.card { position: absolute; left: 72px; right: 72px; top: 124px; height: 228px; background: var(--card); border-radius: 26px; padding: 40px 260px 40px 52px; box-shadow: 0 18px 34px rgba(0,0,0,.32); }
.card h1 { font-size: 62px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.clock { position: absolute; right: 44px; top: 32px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.clock .tok { width: 136px; height: 136px; background: var(--ink); color: #fff; font-size: 72px; box-shadow: inset 0 -10px 0 rgba(0,0,0,.35); }
.clock span { font-family: var(--num); font-weight: 800; font-size: 22px; color: var(--ink-soft); }

.book { position: absolute; left: 72px; right: 72px; top: 386px; display: flex; flex-direction: column; gap: 16px; }
.row { min-height: 104px; border-radius: 18px; display: flex; align-items: center; gap: 26px; padding: 12px 34px 18px 18px; }
.row .tok { width: 74px; height: 74px; font-size: 44px; flex: none; }
.row .txt { font-size: 40px; font-weight: 600; line-height: 1.1; flex: 1; }
</style></head><body>

<div class="card">
  <h1>In 2010, what did someone famously buy for 10,000 bitcoin?</h1>
  <div class="clock"><div class="tok">24</div><span>Q 3 / 12</span></div>
  <div class="locked"><b>6</b> of 30 locked in</div>
</div>

<div class="book">
  <div class="row opt-a plastic"><b class="tok">A</b><span class="txt">Two large pizzas from a Florida pizza place</span></div>
  <div class="row opt-b plastic"><b class="tok">B</b><span class="txt">A used car from a dealer in Texas</span></div>
  <div class="row opt-c plastic"><b class="tok">C</b><span class="txt">A one-way flight from London to Tokyo</span></div>
  <div class="row opt-d plastic"><b class="tok">D</b><span class="txt">The very first domain name ever sold</span></div>
</div>

<script src="faces.js"></script>
</body></html>
