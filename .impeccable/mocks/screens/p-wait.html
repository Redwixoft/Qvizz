<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lobby – phone</title>
<link rel="stylesheet" href="theme.css">
<style>
body.phone { justify-content: center; align-items: center; text-align: center; gap: 18px; padding: 28px 22px; }
.pawn { width: 200px; height: 200px; border: 10px solid var(--red); box-shadow: 0 12px 20px rgba(0,0,0,.35); }
h2 { color: #fff; font-size: 40px; font-weight: 800; }
p { color: #c9d6ff; font-size: 19px; font-weight: 600; line-height: 1.4; max-width: 28ch; }
.seat { background: var(--track); border-radius: 14px; padding: 10px 18px; font-size: 18px; font-weight: 800; }
.seat b { font-family: var(--num); }
.btn { margin-top: 18px; font-size: 18px; }
</style></head><body class="phone">
<i class="face pawn" data-face="anna"></i>
<h2>Anna</h2>
<div class="seat">Seat <b>1</b> of 30 at the table</div>
<p>You're in. Keep an eye on the big screen; the game starts any moment.</p>
<button class="btn light plastic">Redraw my face</button>
<script src="faces.js"></script>
</body></html>
