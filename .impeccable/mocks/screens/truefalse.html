<!doctype html><html lang="en"><head><meta charset="utf-8"><title>True / false – big screen</title>
<link rel="stylesheet" href="theme.css">
<style>
.tf { position: absolute; left: 72px; right: 72px; top: 460px; bottom: 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.tf .row { flex-direction: column; justify-content: center; gap: 20px; padding: 24px 24px 34px; }
.tf .tok { width: 110px; height: 110px; font-size: 64px; }
.tf .txt { flex: none; font-size: 72px; font-weight: 800; }
.tf .t { background: var(--blue); color: #fff; } .tf .t .tok { color: var(--blue); }
.tf .f { background: var(--red); color: #fff; } .tf .f .tok { color: var(--red); }
</style></head><body class="big">
<div class="ticker">
  <div class="pos"><i class="face" data-face="anna"></i><span class="name">Anna</span>412<span class="gain">+118</span></div>
  <div class="pos"><i class="face" data-face="peter"></i><span class="name">Peter</span>380<span class="gain">+100</span></div>
  <div class="pos"><i class="face" data-face="zuzka"></i><span class="name">Zuzka</span>298<span class="gain">+96</span></div>
  <div class="pos"><i class="face" data-face="marek"></i><span class="name">Marek</span>210<span class="gain">+80</span></div>
  <div class="pos"><i class="face" data-face="jana"></i><span class="name">Jana</span>190<span class="gain">+0</span></div>
  <div class="pos"><i class="face" data-face="tomas"></i><span class="name">Tomas</span>150<span class="gain">+0</span></div>
</div>
<div class="qcard">
  <h1>Bitcoin's creator, Satoshi Nakamoto, has never been publicly identified.</h1>
  <div class="clock"><div class="tok">17</div><span>Q 4 / 12</span></div>
  <div class="locked"><b>4</b> of 30 locked in</div>
</div>
<div class="tf">
  <div class="row t plastic"><b class="tok">A</b><span class="txt">True</span></div>
  <div class="row f plastic"><b class="tok">B</b><span class="txt">False</span></div>
</div>
<script src="faces.js"></script>
</body></html>
