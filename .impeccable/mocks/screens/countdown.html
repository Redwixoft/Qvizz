<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Countdown – big screen</title>
<link rel="stylesheet" href="theme.css">
<style>
h1 { position: absolute; left: 0; right: 0; top: 110px; text-align: center; font-size: 96px; font-weight: 800; color: #fff; letter-spacing: -.03em; }
.deal { position: absolute; left: 50%; top: 290px; transform: translateX(-50%); width: 420px; height: 470px; }
.deal .c { position: absolute; inset: 0; border-radius: 30px; background: repeating-linear-gradient(45deg, #d93a28 0 22px, #c03020 22px 44px); border: 12px solid #fff; box-shadow: 0 16px 28px rgba(0,0,0,.35); }
.deal .c:nth-child(1) { transform: rotate(-8deg) translate(-30px, 10px); }
.deal .c:nth-child(2) { transform: rotate(5deg) translate(26px, 6px); }
.deal .top { position: absolute; inset: 0; border-radius: 30px; background: #fff; display: grid; place-items: center; box-shadow: 0 16px 28px rgba(0,0,0,.35); }
.deal .top b { font-family: var(--num); font-size: 300px; font-weight: 800; line-height: 1; color: var(--ink); }
.sub { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; color: #c9d6ff; font-size: 28px; font-weight: 600; }
</style></head><body class="big">
<h1>The fun begins now!</h1>
<div class="deal"><div class="c"></div><div class="c"></div><div class="top"><b>3</b></div></div>
<div class="sub">12 questions · 30 players · phones ready</div>
</body></html>
