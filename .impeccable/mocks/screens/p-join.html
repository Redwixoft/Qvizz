<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join – phone</title>
<link rel="stylesheet" href="theme.css">
<style>
body.phone { justify-content: center; padding: 28px 20px; gap: 22px; }
.mark { font-size: 76px; font-weight: 800; color: #fff; letter-spacing: -.04em; text-align: center; line-height: .9; }
.mark i { font-style: normal; color: var(--yellow); }
.tag { color: #c9d6ff; text-align: center; font-size: 18px; font-weight: 600; }
.form { background: var(--card); border-radius: 22px; padding: 22px 18px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 18px rgba(0,0,0,.3); }
label { font-size: 18px; font-weight: 800; }
input { font: 600 24px var(--display); color: var(--ink); background: var(--track); border: 3px solid var(--track-line); border-radius: 14px; padding: 14px 16px; caret-color: var(--red); }
input:focus { outline: none; border-color: var(--ink); }
.btn { font-size: 24px; }
.err { color: var(--down); font-size: 16px; font-weight: 600; }
</style></head><body class="phone">
<div class="mark">Qvizz<i>.</i></div>
<div class="tag">Take a seat at the table</div>
<form class="form">
  <label for="n">Your nickname</label>
  <input id="n" value="Anna" maxlength="20" autocomplete="nickname">
  <div class="err">Someone already sits there as "Peter". Pick another name.</div>
  <button class="btn plastic" type="button">Join the game</button>
</form>
</body></html>
