<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Answer – phone</title>
<link rel="stylesheet" href="theme.css">
<style>
body { width: 390px; height: 844px; background: var(--board); font-family: var(--display); color: var(--ink); position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 14px 14px 16px; gap: 12px; }

.q { position: relative; background: var(--card); border-radius: 18px; padding: 14px 76px 14px 16px; min-height: 86px; box-shadow: 0 8px 14px rgba(0,0,0,.28); }
.q p { font-size: 17px; font-weight: 600; line-height: 1.3; }
.q .tok { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 54px; height: 54px; background: var(--ink); color: #fff; font-size: 28px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.35); }

.answers { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.a { position: relative; flex: 1; border: 0; border-radius: 18px; display: flex; align-items: center; gap: 14px; padding: 10px 16px 16px 12px; text-align: left; font-family: var(--display); }
.a .tok { width: 52px; height: 52px; font-size: 30px; flex: none; }
.a .t { font-size: 21px; font-weight: 600; line-height: 1.2; }
.a.dim { filter: saturate(.55) brightness(.85); }
.a.on { outline: 5px solid #fff; outline-offset: 3px; }
.a .tick { position: absolute; right: 12px; top: 12px; width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
.a .tick svg { width: 20px; height: 20px; }

.status { color: #fff; text-align: center; font-size: 16px; font-weight: 600; }

.me { display: flex; align-items: center; gap: 10px; background: var(--track); border-radius: 14px; padding: 8px 14px 8px 8px; }
.me .face { width: 44px; height: 44px; border: 4px solid var(--red); }
.me .n { font-size: 19px; font-weight: 800; flex: 1; }
.me .s { font-family: var(--num); font-weight: 800; font-size: 18px; }
.me .r { font-family: var(--num); font-weight: 800; font-size: 16px; background: var(--gold); border-radius: 6px; padding: 3px 8px; }
</style></head><body>

<div class="q"><p>In 2010, what did someone famously buy for 10,000 bitcoin?</p><b class="tok">24</b></div>

<div class="answers">
  <button class="a opt-a plastic dim"><b class="tok">A</b><span class="t">Two large pizzas from a Florida pizza place</span></button>
  <button class="a opt-b plastic on"><b class="tok">B</b><span class="t">A used car from a dealer in Texas</span>
    <span class="tick"><svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="#23843a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
  <button class="a opt-c plastic dim"><b class="tok">C</b><span class="t">A one-way flight from London to Tokyo</span></button>
  <button class="a opt-d plastic dim"><b class="tok">D</b><span class="t">The very first domain name ever sold</span></button>
</div>

<div class="status">Answer saved. Tap another to change it.</div>

<div class="me"><i class="face" data-face="anna"></i><span class="n">Anna</span><span class="s">412</span><span class="r">#1</span></div>

<script src="faces.js"></script>
</body></html>
