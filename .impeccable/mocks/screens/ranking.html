<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ranking – big screen</title>
<link rel="stylesheet" href="theme.css">
<style>
body { width: 1440px; height: 900px; background: var(--board); font-family: var(--display); color: var(--ink); position: relative; overflow: hidden; }

h1 { position: absolute; left: 72px; top: 48px; font-size: 64px; font-weight: 800; color: #fff; letter-spacing: -.02em; }
h1 span { font-family: var(--num); font-size: 30px; font-weight: 800; color: var(--gold); margin-left: 18px; letter-spacing: 0; }

/* the standings card, styled like an open positions table */
.sheet { position: absolute; left: 72px; top: 150px; width: 930px; bottom: 56px; background: var(--card); border-radius: 26px; padding: 22px 34px 26px; box-shadow: 0 18px 34px rgba(0,0,0,.32); }
.head, .line { display: grid; grid-template-columns: 70px 56px 92px 1fr 150px 170px; align-items: center; column-gap: 14px; }
.head { font-size: 20px; font-weight: 600; color: var(--ink-soft); padding: 4px 8px 12px; border-bottom: 2px solid var(--track-line); }
.head .r { text-align: right; }
.line { height: 112px; padding: 0 8px; border-bottom: 2px solid #eee9de; }
.line:last-child { border-bottom: 0; }
.rank { font-family: var(--num); font-size: 48px; font-weight: 800; }
.move { display: flex; align-items: center; gap: 4px; font-family: var(--num); font-weight: 800; font-size: 22px; }
.move svg { width: 20px; height: 20px; }
.move.up { color: var(--up); } .move.down { color: var(--down); } .move.same { color: #9aa1b5; }
.line .face { width: 80px; height: 80px; border: 5px solid var(--pc); }
.who { font-size: 40px; font-weight: 800; }
.gain { justify-self: end; font-family: var(--num); font-weight: 800; font-size: 26px; background: var(--gold); border-radius: 8px; padding: 6px 12px; }
.gain.zero { background: #eee9de; color: var(--ink-soft); }
.total { justify-self: end; font-family: var(--num); font-size: 48px; font-weight: 800; }
.line.first { background: #fff8e1; border-radius: 16px; border-bottom-color: transparent; }

/* right column: the played-card pile + the trade of the round */
.side { position: absolute; left: 1040px; right: 72px; top: 150px; bottom: 56px; display: flex; flex-direction: column; gap: 28px; }
.trade { background: var(--track); border-radius: 22px; padding: 26px 28px; }
.trade h2 { font-size: 26px; font-weight: 800; }
.trade .p { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
.trade .face { width: 72px; height: 72px; border: 5px solid var(--green); }
.trade b { font-size: 34px; font-weight: 800; display: block; }
.trade small { font-size: 22px; font-weight: 600; color: var(--ink-soft); }
.pile { position: relative; flex: 1; }
.pile .c { position: absolute; left: 40px; top: 20px; width: 210px; height: 280px; border-radius: 20px; background: #fff; border: 2px solid var(--track-line); box-shadow: 0 10px 18px rgba(0,0,0,.28); }
.pile .c:nth-child(1) { transform: rotate(-9deg); }
.pile .c:nth-child(2) { transform: rotate(4deg); left: 52px; }
.pile .c:nth-child(3) { transform: rotate(-2deg); left: 60px; display: grid; place-items: center; text-align: center; }
.pile .c b { font-family: var(--num); font-size: 64px; font-weight: 800; display: block; }
.pile .c span { font-size: 22px; font-weight: 600; color: var(--ink-soft); }
.next { position: absolute; right: 0; bottom: 0; background: var(--yellow); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 28px; border-radius: 16px; padding: 18px 30px 24px; border: 0; }
</style></head><body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="up" viewBox="0 0 20 20"><path d="M10 3l7 11H3z" fill="currentColor"/></symbol>
  <symbol id="down" viewBox="0 0 20 20"><path d="M10 17L3 6h14z" fill="currentColor"/></symbol>
  <symbol id="same" viewBox="0 0 20 20"><rect x="3" y="8" width="14" height="4" rx="2" fill="currentColor"/></symbol>
</svg>

<h1>Standings<span>after Q 3 / 12</span></h1>

<div class="sheet">
  <div class="head"><span>Rank</span><span></span><span></span><span>Player</span><span class="r">This round</span><span class="r">Total</span></div>
  <div class="line first" style="--pc:var(--red)"><span class="rank">1</span><span class="move up"><svg><use href="#up"/></svg>1</span><i class="face" data-face="anna"></i><span class="who">Anna</span><span class="gain">+118</span><span class="total">412</span></div>
  <div class="line" style="--pc:var(--green)"><span class="rank">2</span><span class="move down"><svg><use href="#down"/></svg>1</span><i class="face" data-face="peter"></i><span class="who">Peter</span><span class="gain">+100</span><span class="total">380</span></div>
  <div class="line" style="--pc:var(--blue)"><span class="rank">3</span><span class="move up"><svg><use href="#up"/></svg>2</span><i class="face" data-face="zuzka"></i><span class="who">Zuzka</span><span class="gain">+96</span><span class="total">298</span></div>
  <div class="line" style="--pc:var(--yellow)"><span class="rank">4</span><span class="move same"><svg><use href="#same"/></svg></span><i class="face" data-face="marek"></i><span class="who">Marek</span><span class="gain">+80</span><span class="total">210</span></div>
  <div class="line" style="--pc:#864cbf"><span class="rank">5</span><span class="move down"><svg><use href="#down"/></svg>2</span><i class="face" data-face="jana"></i><span class="who">Jana</span><span class="gain zero">+0</span><span class="total">190</span></div>
</div>

<div class="side">
  <div class="trade">
    <h2>Trade of the round</h2>
    <div class="p"><i class="face" data-face="zuzka"></i><div><b>Zuzka</b><small>climbed 2 places with +96</small></div></div>
  </div>
  <div class="pile"><div class="c"></div><div class="c"></div><div class="c"><div><b>3</b><span>cards played<br>9 to go</span></div></div></div>
  <button class="next plastic">Next question</button>
</div>

<script src="faces.js"></script>
</body></html>
