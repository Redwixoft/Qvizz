<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Result – phone</title>
<link rel="stylesheet" href="theme.css">
<style>
.res { background: var(--card); border-radius: 24px; padding: 26px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: 0 10px 18px rgba(0,0,0,.3); }
.badge { width: 96px; height: 96px; border-radius: 50%; background: var(--green); display: grid; place-items: center; box-shadow: inset 0 -8px 0 rgba(0,0,0,.2); }
.badge svg { width: 54px; height: 54px; }
.res h2 { font-size: 34px; font-weight: 800; }
.pts { font-family: var(--num); font-size: 56px; font-weight: 800; background: var(--gold); border-radius: 14px; padding: 4px 18px; line-height: 1.1; }
.bonus { font-size: 17px; font-weight: 600; color: var(--ink-soft); }
.ans { font-size: 17px; font-weight: 600; color: var(--ink-soft); line-height: 1.35; }
.ans b { color: var(--ink); }
.rank { display: flex; align-items: center; justify-content: center; gap: 12px; color: #fff; font-size: 30px; font-weight: 800; }
.rank .up { display: flex; align-items: center; gap: 4px; font: 800 20px var(--num); color: #fff; background: var(--up); border-radius: 8px; padding: 3px 8px; }
.rank .up svg { width: 16px; height: 16px; }
.boost { position: relative; background: var(--track); border-radius: 18px; padding: 16px 18px; font-size: 21px; font-weight: 800; line-height: 1.3; display: flex; gap: 12px; align-items: center; }
.boost .face { flex: none; width: 54px; height: 54px; border: 4px solid var(--green); }
.spacer { flex: 1; }
</style></head><body class="phone">
<div class="res">
  <div class="badge"><svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h2>Correct!</h2>
  <div class="pts">+118</div>
  <div class="bonus">100 for the answer, +18 for being second fastest</div>
  <div class="ans">Answer: <b>A · Two large pizzas from a Florida pizza place</b></div>
</div>
<div class="rank">You are #2 of 30 <span class="up"><svg viewBox="0 0 20 20"><path d="M10 3l7 11H3z" fill="currentColor"/></svg>1</span></div>
<div class="boost"><i class="face" data-face="anna"></i><span>Only 32 points behind Anna. One good answer and you pass her!</span></div>
<div class="spacer"></div>
<div class="me"><i class="face" data-face="peter" style="border-color:var(--green)"></i><span class="n">Peter</span><span class="s">380</span><span class="r">#2</span></div>
<script src="faces.js"></script>
</body></html>
