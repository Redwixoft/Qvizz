<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pawn race – big screen</title>
<link rel="stylesheet" href="theme.css">
<style>
body { width: 1440px; height: 900px; background: var(--board); font-family: var(--display); color: var(--ink); position: relative; overflow: hidden; }

/* The score track: a printed board strip. Each player is a plastic pawn with their face on top.
   After a reveal the pawns hop forward square by square, by the points they just won. */
.race { position: absolute; left: 24px; right: 24px; top: 14px; height: 150px; }
.track { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: grid; grid-template-columns: repeat(24, 1fr); gap: 4px; background: var(--board-deep); border-radius: 12px; padding: 5px; }
.track i { background: var(--track); border-radius: 6px; }
.track i:nth-child(6n) { background: var(--gold); }
.track i:first-child { background: #fff; }
.track .lbl { position: absolute; bottom: 12px; font-family: var(--num); font-weight: 800; font-size: 15px; color: var(--ink-soft); }

.pawn { position: absolute; bottom: 22px; width: 64px; margin-left: -32px; display: flex; flex-direction: column; align-items: center; transition: left .32s cubic-bezier(.3,.7,.4,1); z-index: 2; }
.pawn .face { width: 50px; height: 50px; border: 4px solid var(--pc); position: relative; z-index: 2; }
.pawn svg.body { width: 46px; height: 34px; margin-top: -10px; filter: drop-shadow(0 4px 3px rgba(0,0,0,.35)); }
.pawn .nm { position: absolute; bottom: -24px; font-size: 13px; font-weight: 800; color: #fff; white-space: nowrap; opacity: 0; transition: opacity .3s; }
.pawn.hop { animation: hop .32s cubic-bezier(.3,.7,.4,1); }
@keyframes hop { 40% { transform: translateY(-22px); } 100% { transform: translateY(0); } }
.pawn .gain { position: absolute; top: calc(-30px - var(--stack, 0) * 26px); font-family: var(--num); font-weight: 800; font-size: 18px; background: var(--gold); border-radius: 6px; padding: 1px 7px; opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s; }
.pawn.won .gain { opacity: 1; transform: none; }
.pawn.lead::after { content: ""; position: absolute; top: -8px; width: 0; height: 0; }

/* the rest of the reveal screen, unchanged */
.card { position: absolute; left: 72px; right: 72px; top: 190px; height: 196px; background: var(--card); border-radius: 26px; padding: 34px 52px; box-shadow: 0 18px 34px rgba(0,0,0,.32); }
.card h1 { font-size: 56px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; max-width: 1000px; }
.card p { margin-top: 12px; font-size: 22px; font-weight: 600; color: var(--ink-soft); }
.card .btn { position: absolute; right: 40px; top: 34px; font-size: 26px; padding: 18px 28px 24px; }
.book { position: absolute; left: 72px; right: 72px; top: 416px; display: flex; flex-direction: column; gap: 14px; }
.row { position: relative; min-height: 100px; border-radius: 18px; display: flex; align-items: center; gap: 26px; padding: 12px 34px 18px 18px; overflow: hidden; }
.row .tok { width: 72px; height: 72px; font-size: 42px; flex: none; }
.row .txt { font-size: 38px; font-weight: 600; flex: 1; }
.row b.n { font-family: var(--num); font-size: 40px; }
.row.out { filter: saturate(.35) brightness(.75); }
.row.win { outline: 6px solid #fff; outline-offset: 4px; overflow: visible; }
.row .vol { position: absolute; left: 0; bottom: 0; height: 12px; background: rgba(255,255,255,.78); border-radius: 0 6px 0 0; }

.replay { position: absolute; right: 10px; bottom: 8px; background: var(--board-deep); color: #fff; font: 600 14px var(--display); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
</style></head><body>

<div class="race" id="race">
  <div class="track" id="track"></div>
</div>

<div class="card">
  <h1>In 2010, what did someone famously buy for 10,000 bitcoin?</h1>
  <p><b>5</b> of 8 got it right · first in: Zuzka, Anna, Peter</p>
  <button class="btn plastic">Standings</button>
</div>
<div class="book">
  <div class="row opt-a plastic win"><b class="tok">A</b><span class="txt">Two large pizzas from a Florida pizza place</span><b class="n">5</b><i class="vol" style="width:62%"></i></div>
  <div class="row opt-b plastic out"><b class="tok">B</b><span class="txt">A used car from a dealer in Texas</span><b class="n">2</b><i class="vol" style="width:25%"></i></div>
  <div class="row opt-c plastic out"><b class="tok">C</b><span class="txt">A one-way flight from London to Tokyo</span><b class="n">1</b><i class="vol" style="width:13%"></i></div>
  <div class="row opt-d plastic out"><b class="tok">D</b><span class="txt">The very first domain name ever sold</span><b class="n">0</b><i class="vol" style="width:0"></i></div>
</div>

<button class="replay" id="replay">Replay the hop</button>

<script src="faces.js"></script>
<script>
// Mock data: score before this question, and points won in it.
const players = [
  { face: 'anna',  name: 'Anna',  colour: '#d93a28', before: 294, gain: 118 },
  { face: 'peter', name: 'Peter', colour: '#23843a', before: 280, gain: 116 },
  { face: 'zuzka', name: 'Zuzka', colour: '#0f78b5', before: 178, gain: 120 },
  { face: 'marek', name: 'Marek', colour: '#f2b705', before: 210, gain: 0 },
  { face: 'jana',  name: 'Jana',  colour: '#864cbf', before: 190, gain: 0 },
  { face: 'tomas', name: 'Tomas', colour: '#0aa3a3', before: 150, gain: 114 },
  { face: 'g7',    name: 'Lucia', colour: '#e86fa6', before: 96,  gain: 112 },
  { face: 'g9',    name: 'Martin', colour: '#7a4a1d', before: 120, gain: 0 }
];
const SQUARES = 24;
const track = document.getElementById('track'), race = document.getElementById('race');
track.innerHTML = Array.from({ length: SQUARES }, () => '<i></i>').join('');

// Squares are scaled to the leader's score after this question, so the leader always reaches the far end.
const leaderScore = Math.max(...players.map(p => p.before + p.gain));
const squareOf = score => Math.round((score / leaderScore) * (SQUARES - 1));
const xOf = (sq, stack) => {
  const w = race.clientWidth - 10, cell = w / SQUARES;
  return 5 + cell * sq + cell / 2 + stack * 30;   // pawns sharing a square stand apart
};
const body = c => `<svg class="body" viewBox="0 0 46 34"><path d="M15 2h16l4 14c6 2 10 6 10 12v4H1v-4c0-6 4-10 10-12z" fill="${c}"/><path d="M1 30h44v4H1z" fill="rgba(0,0,0,.25)"/></svg>`;

const els = players.map(p => {
  const el = document.createElement('div');
  el.className = 'pawn';
  el.style.setProperty('--pc', p.colour);
  el.innerHTML = `<span class="gain">+${p.gain}</span><i class="face" data-face="${p.face}"></i>${body(p.colour)}`;
  el.querySelector('.face').innerHTML = faceSvg(p.face);
  race.appendChild(el);
  return el;
});

function place(useAfter) {
  const taken = {};
  players.forEach((p, i) => {
    const sq = squareOf(useAfter ? p.before + p.gain : p.before);
    const stack = taken[sq] = (taken[sq] ?? -1) + 1;
    els[i].dataset.sq = sq;
    els[i].style.left = xOf(sq, stack) + 'px';
    els[i].style.zIndex = 10 + sq;
    els[i].style.setProperty("--stack", stack);
  });
}

// Hop each scoring pawn forward one square at a time, leaders last for suspense.
async function run() {
  els.forEach(e => e.classList.remove('won'));
  place(false);
  await new Promise(r => setTimeout(r, 900));
  const order = players.map((p, i) => i).filter(i => players[i].gain > 0)
    .sort((a, b) => (players[a].before + players[a].gain) - (players[b].before + players[b].gain));
  for (const i of order) {
    const p = players[i], el = els[i];
    el.classList.add('won');
    const from = squareOf(p.before), to = squareOf(p.before + p.gain);
    for (let sq = from + 1; sq <= to; sq++) {
      el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop');
      el.style.left = xOf(sq, 0) + 'px';
      el.style.zIndex = 10 + sq;
      await new Promise(r => setTimeout(r, 170));
    }
    await new Promise(r => setTimeout(r, 120));
  }
  place(true);   // settle pawns that share a square
}
document.getElementById('replay').onclick = run;
run();
</script>
</body></html>
