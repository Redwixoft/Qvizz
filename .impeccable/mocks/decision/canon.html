<!doctype html><html><head><meta charset="utf-8"><title>Category standard</title>
<style>*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#46178f;font-family:system-ui,sans-serif;color:#fff;padding:50px 60px;display:flex;flex-direction:column;gap:30px}
.q{background:#fff;color:#222;border-radius:8px;padding:40px;font-size:64px;font-weight:800;text-align:center}
.mid{flex:1;display:flex;align-items:center;justify-content:space-between}.t{width:150px;height:150px;border-radius:50%;background:#864cbf;display:grid;place-items:center;font-size:70px;font-weight:800}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}.o{height:130px;border-radius:6px;font-size:48px;font-weight:800;display:flex;align-items:center;padding:30px;color:#fff}
</style></head><body><div class="q">What is the capital of Australia?</div><div class="mid"><div class="t">24</div><div style="font-size:40px;font-weight:800">3 answers</div></div>
<div class="g"><div class="o" style="background:#c3162f">Sydney</div><div class="o" style="background:#1368ce">Canberra</div><div class="o" style="background:#8a6400">Melbourne</div><div class="o" style="background:#1f700a">Perth</div></div></body></html>
