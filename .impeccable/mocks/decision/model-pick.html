<!doctype html><html><head><meta charset="utf-8"><title>Pub Quiz Night</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--slate:#1e2a25;--chalk:#f1efe6;--cr:#ff7b6b;--cg:#8fe08a;--cb:#7cc4ff;--cy:#ffe27a;--wood:#6b4426}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:var(--wood);padding:28px;font-family:'Barlow Condensed',sans-serif;color:var(--chalk)}
.board{height:100%;border-radius:10px;background:radial-gradient(ellipse at 30% 20%,#2a3832,var(--slate) 70%);box-shadow:inset 0 0 80px rgba(0,0,0,.6);padding:56px 72px;position:relative}
.round{font-family:'Cabin Sketch';font-size:40px;color:var(--cy)}
h1{font-family:'Cabin Sketch';font-size:84px;line-height:1.02;margin-top:18px;max-width:1000px}
.timer{position:absolute;right:72px;top:40px;font-family:'Cabin Sketch';font-size:130px}
.tally{position:absolute;right:76px;top:200px;font-size:30px;letter-spacing:.1em;opacity:.85}
.mats{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;position:absolute;left:72px;right:72px;bottom:56px}
.mat{aspect-ratio:1;border-radius:50%;border:6px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;text-align:center;background:rgba(255,255,255,.04)}
.mat b{font-family:'Cabin Sketch';font-size:90px;line-height:1}
.mat span{font-size:44px;font-weight:800;color:var(--chalk)}
.a{border-color:var(--cr);color:var(--cr);transform:rotate(-4deg)}.b{border-color:var(--cg);color:var(--cg);transform:rotate(3deg)}.c{border-color:var(--cb);color:var(--cb);transform:rotate(-2deg)}.d{border-color:var(--cy);color:var(--cy);transform:rotate(5deg)}
</style></head><body><div class="board">
<div class="round">Round 1 · Question 1</div>
<h1>What is the capital of Australia?</h1>
<div class="timer">24</div><div class="tally">3 OF 8 ANSWERED</div>
<div class="mats"><div class="mat a"><b>A</b><span>Sydney</span></div><div class="mat b"><b>B</b><span>Canberra</span></div><div class="mat c"><b>C</b><span>Melbourne</span></div><div class="mat d"><b>D</b><span>Perth</span></div></div>
</div></body></html>
