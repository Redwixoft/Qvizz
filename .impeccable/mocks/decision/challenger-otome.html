<!doctype html><html><head><meta charset="utf-8"><title>Dealt Choices</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#2e1630;--rose:#f3c4cf;--rose2:#e48aa0;--ivory:#fbf4f6;--r:#d9475b;--g:#3f9b6e;--b:#4b78c9;--y:#e0a526}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:linear-gradient(180deg,#5b2a52,var(--plum));font-family:Figtree,sans-serif;color:var(--plum);position:relative;overflow:hidden}
.cast{position:absolute;left:60px;top:70px;display:flex;flex-direction:column;gap:18px}
.cast div{width:120px;height:140px;border-radius:60px 60px 14px 14px;background:var(--rose);border:4px solid var(--ivory)}
.fan{position:absolute;left:320px;right:120px;top:70px;height:390px}
.c{position:absolute;bottom:0;width:250px;height:340px;border-radius:20px;background:var(--ivory);border:6px solid;padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 30px rgba(0,0,0,.35);transform-origin:50% 140%}
.c b{font-family:Gloock;font-size:100px;line-height:1;font-weight:400}
.c span{font-size:40px;font-weight:800}
.c1{left:0;transform:rotate(-12deg);border-color:var(--r);color:var(--r)}
.c2{left:240px;transform:rotate(-4deg);border-color:var(--g);color:var(--g)}
.c3{left:480px;transform:rotate(4deg);border-color:var(--b);color:var(--b)}
.c4{left:720px;transform:rotate(12deg);border-color:var(--y);color:#9a6c00}
.window{position:absolute;left:260px;right:60px;bottom:50px;height:260px;background:rgba(251,244,246,.95);border-radius:26px;outline:3px solid var(--rose2);outline-offset:-14px;padding:44px 60px}
.window h1{font-family:Gloock;font-size:70px;line-height:1.05;font-weight:400}
.window .who{font-size:24px;font-weight:800;color:#a3395c;letter-spacing:.08em}
.bar{position:absolute;left:60px;right:60px;bottom:34px;height:14px;border-radius:7px;background:#ead3da}
.bar i{display:block;height:100%;width:62%;border-radius:7px;background:var(--rose2)}
</style></head><body>
<div class="cast"><div></div><div></div><div></div><div></div></div>
<div class="fan"><div class="c c1"><b>A</b><span>Sydney</span></div><div class="c c2"><b>B</b><span>Canberra</span></div><div class="c c3"><b>C</b><span>Melbourne</span></div><div class="c c4"><b>D</b><span>Perth</span></div></div>
<div class="window"><div class="who">QUESTION 1 OF 5</div><h1>What is the capital of Australia?</h1><div class="bar"><i></i></div></div>
</body></html>
