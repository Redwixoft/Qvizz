<!doctype html><html><head><meta charset="utf-8"><title>Category standard</title>
<style>*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#46178f;font-family:system-ui,sans-serif;color:#fff;padding:44px 60px;display:flex;flex-direction:column;gap:26px}
.q{background:#fff;color:#222;border-radius:8px;padding:34px 40px;font-size:54px;font-weight:800;text-align:center}
.mid{flex:1;display:flex;align-items:center;justify-content:space-between}.t{width:140px;height:140px;border-radius:50%;background:#864cbf;display:grid;place-items:center;font-size:64px;font-weight:800}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}.o{min-height:140px;border-radius:6px;font-size:38px;font-weight:700;display:flex;align-items:center;padding:24px 30px;color:#fff}
</style></head><body><div class="q">In 2010, what did someone famously buy for 10,000 bitcoin?</div><div class="mid"><div class="t">24</div><div style="font-size:36px;font-weight:800">3 answers</div></div>
<div class="g"><div class="o" style="background:#c3162f">Two large pizzas from a Florida pizza place</div><div class="o" style="background:#1368ce">A used car from a dealer in Texas</div><div class="o" style="background:#8a6400">A one-way flight from London to Tokyo</div><div class="o" style="background:#1f700a">The very first domain name ever sold</div></div></body></html>
