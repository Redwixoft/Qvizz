<!doctype html><html><head><meta charset="utf-8"><title>Exercise Book</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Atkinson+Hyperlegible:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbfcff;--grid:#cfe0f5;--ink:#1d3a8a;--pen:#d62828;--hy:#fff06b;--hp:#ff9ec7;--hg:#9ff0a8;--hb:#9fd8ff}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;font-family:'Atkinson Hyperlegible',sans-serif;color:var(--ink);position:relative;padding:70px 120px 0 200px}
.marginline{position:absolute;left:160px;top:0;bottom:0;width:3px;background:#f08a8a}
.no{font-family:Kalam;font-size:38px;color:var(--pen)}
h1{font-family:Kalam;font-size:86px;line-height:1.05;margin-top:10px;max-width:960px}
.note{position:absolute;right:90px;top:60px;width:200px;height:200px;background:#ffe45c;transform:rotate(4deg);box-shadow:0 10px 18px rgba(0,0,0,.18);display:grid;place-items:center;font-family:Kalam;font-size:100px}
.opts{margin-top:70px;display:grid;grid-template-columns:1fr 1fr;gap:34px 60px;max-width:1100px}
.o{display:flex;align-items:center;gap:22px;font-size:50px}
.o b{font-family:Kalam;width:80px;height:80px;border:5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:46px}
.o span{padding:2px 16px;border-radius:4px}
.a span{background:var(--hp)}.b span{background:var(--hg)}.c span{background:var(--hb)}.d span{background:var(--hy)}
.margin{position:absolute;left:36px;top:120px;display:flex;flex-direction:column;gap:22px}
.margin i{width:90px;height:90px;border:4px solid var(--ink);border-radius:50%;display:block;transform:rotate(-6deg)}
</style></head><body>
<div class="marginline"></div>
<div class="margin"><i></i><i></i><i></i><i></i></div>
<div class="no">Question 1 / 5</div>
<h1>What is the capital of Australia?</h1>
<div class="note">24</div>
<div class="opts"><div class="o a"><b>A</b><span>Sydney</span></div><div class="o b"><b>B</b><span>Canberra</span></div><div class="o c"><b>C</b><span>Melbourne</span></div><div class="o d"><b>D</b><span>Perth</span></div></div>
</body></html>
