<!doctype html><html><head><meta charset="utf-8"><title>Studio 72</title>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wall:#0f4c5c;--wall2:#0b3a47;--mus:#f2b134;--tan:#f26a21;--ivory:#fff7ec;--a:#c4263f;--b:#1d7f74;--c:#3c6fd1;--d:#f2b134}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;font-family:Barlow,sans-serif;color:var(--ivory);position:relative;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 115%,var(--wall) 0 6deg,var(--wall2) 6deg 12deg)}
.screen{position:absolute;left:110px;right:110px;top:46px;height:300px;border-radius:56px;background:var(--ivory);color:var(--wall2);border:12px solid var(--mus);padding:40px 64px;box-shadow:0 14px 0 var(--tan)}
.screen small{font-size:24px;font-weight:800;letter-spacing:.12em;color:#b8480c}
.screen h1{font-family:Shrikhand;font-size:64px;line-height:1.1;font-weight:400;margin-top:12px;max-width:960px}
.flip{position:absolute;right:50px;top:-36px;display:flex;gap:6px}
.flip span{width:72px;height:100px;background:#1a1a1a;color:#fff;border-radius:10px;display:grid;place-items:center;font-size:72px;font-weight:800}
.pods{position:absolute;left:110px;right:110px;top:400px;bottom:44px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pod{border-radius:28px;padding:22px 30px;display:flex;align-items:center;gap:26px}
.pod b{font-family:Shrikhand;font-size:76px;line-height:1;font-weight:400;flex:none;width:96px;height:96px;border-radius:50%;background:var(--ivory);display:grid;place-items:center}
.pod span{font-size:38px;font-weight:700;line-height:1.15}
.a{background:var(--a)}.a b{color:var(--a)}.b{background:var(--b)}.b b{color:var(--b)}.c{background:var(--c)}.c b{color:var(--c)}.d{background:var(--d);color:var(--wall2)}.d b{color:#8a5a00}
</style></head><body>
<div class="screen"><small>QUESTION 3 OF 12</small><h1>In 2010, what did someone famously buy for 10,000 bitcoin?</h1><div class="flip"><span>2</span><span>4</span></div></div>
<div class="pods">
<div class="pod a"><b>A</b><span>Two large pizzas from a Florida pizza place</span></div>
<div class="pod b"><b>B</b><span>A used car from a dealer in Texas</span></div>
<div class="pod c"><b>C</b><span>A one-way flight from London to Tokyo</span></div>
<div class="pod d"><b>D</b><span>The very first domain name ever sold</span></div>
</div></body></html>
