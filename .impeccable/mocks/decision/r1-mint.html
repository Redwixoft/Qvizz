<!doctype html><html><head><meta charset="utf-8"><title>The Mint</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--graphite:#17181d;--plate:#23252d;--gold:#d9ab3f;--gold2:#a77b1f;--silver:#c9ced8;--ivory:#f6f3ec;--a:#c8414b;--b:#2f8f6a;--c:#3d6dbf;--d:#d9ab3f}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:var(--graphite);background-image:repeating-radial-gradient(circle at 50% -20%,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);font-family:Figtree,sans-serif;color:var(--ivory);position:relative;overflow:hidden;padding:56px 96px}
.top{display:flex;gap:44px;align-items:center}
.coin{flex:none;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d27a,var(--gold) 55%,var(--gold2));box-shadow:0 0 0 8px #8a651a,0 14px 24px rgba(0,0,0,.5);display:grid;place-items:center;font-family:'Young Serif';font-size:80px;color:#3a2a06}
small{font-size:24px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
h1{font-family:'Young Serif';font-size:62px;line-height:1.1;font-weight:400;margin-top:12px}
.plaques{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.p{display:flex;align-items:center;gap:24px;background:var(--plate);border-radius:18px;padding:24px 28px;border:2px solid #34373f}
.p b{flex:none;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-family:'Young Serif';font-size:44px;color:#fff;box-shadow:inset 0 0 0 5px rgba(255,255,255,.35)}
.p span{font-size:36px;font-weight:600;line-height:1.18}
.a b{background:var(--a)}.b b{background:var(--b)}.c b{background:var(--c)}.d b{background:var(--d);color:#3a2a06}
.p.a{border-color:var(--a)}.p.b{border-color:var(--b)}.p.c{border-color:var(--c)}.p.d{border-color:var(--d)}
</style></head><body>
<div class="top"><div class="coin">24</div><div><small>QUESTION 3 OF 12</small><h1>In 2010, what did someone famously buy for 10,000 bitcoin?</h1></div></div>
<div class="plaques">
<div class="p a"><b>A</b><span>Two large pizzas from a Florida pizza place</span></div>
<div class="p b"><b>B</b><span>A used car from a dealer in Texas</span></div>
<div class="p c"><b>C</b><span>A one-way flight from London to Tokyo</span></div>
<div class="p d"><b>D</b><span>The very first domain name ever sold</span></div>
</div></body></html>
