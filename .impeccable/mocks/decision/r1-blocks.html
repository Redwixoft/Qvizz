<!doctype html><html><head><meta charset="utf-8"><title>Block by Block</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#dfe7fb;--ink:#17204a;--chain:#9aa8d6;--a:#e2483a;--b:#2c9a56;--c:#2f6fe0;--d:#f4b81c}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:var(--sky);font-family:Lexend,sans-serif;color:var(--ink);position:relative;overflow:hidden;padding:40px 96px}
.chain{display:flex;align-items:center;gap:0;height:84px}
.blk{width:64px;height:64px;border-radius:12px;background:#fff;box-shadow:inset 0 -8px 0 #c3cdea;display:grid;place-items:center;font-weight:800;font-size:24px;color:#4d5c94}
.blk.done{background:var(--ink);color:#fff;box-shadow:inset 0 -8px 0 #0b1233}
.blk.now{width:80px;height:80px;background:var(--d);color:var(--ink);box-shadow:inset 0 -10px 0 #c48f00;font-size:30px}
.link{width:34px;height:8px;background:var(--chain);border-radius:4px}
.q{display:flex;justify-content:space-between;align-items:flex-start;margin-top:34px;gap:40px}
h1{font-size:64px;line-height:1.08;font-weight:800;letter-spacing:-.02em;max-width:1000px}
.timer{flex:none;width:150px;height:150px;border-radius:24px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:76px;font-weight:800;box-shadow:inset 0 -14px 0 #0b1233}
.grid{position:absolute;left:96px;right:96px;bottom:48px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.o{display:flex;align-items:center;gap:24px;border-radius:20px;padding:22px 28px 30px;color:#fff;box-shadow:inset 0 -14px 0 rgba(0,0,0,.2)}
.o b{flex:none;width:80px;height:80px;border-radius:14px;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:46px;font-weight:800}
.o span{font-size:37px;font-weight:600;line-height:1.15}
.a{background:var(--a)}.a b{color:var(--a)}.b{background:var(--b)}.b b{color:var(--b)}.c{background:var(--c)}.c b{color:var(--c)}.d{background:var(--d);color:var(--ink)}.d b{color:#8a6400}
</style></head><body>
<div class="chain"><div class="blk done">1</div><div class="link"></div><div class="blk done">2</div><div class="link"></div><div class="blk now">3</div><div class="link"></div><div class="blk">4</div><div class="link"></div><div class="blk">5</div><div class="link"></div><div class="blk">6</div><div class="link"></div><div class="blk">7</div><div class="link"></div><div class="blk">8</div></div>
<div class="q"><h1>In 2010, what did someone famously buy for 10,000 bitcoin?</h1><div class="timer">24</div></div>
<div class="grid">
<div class="o a"><b>A</b><span>Two large pizzas from a Florida pizza place</span></div>
<div class="o b"><b>B</b><span>A used car from a dealer in Texas</span></div>
<div class="o c"><b>C</b><span>A one-way flight from London to Tokyo</span></div>
<div class="o d"><b>D</b><span>The very first domain name ever sold</span></div>
</div></body></html>
