<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3e93">
  <title>Qvizz – Host remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=JetBrains+Mono:wght@600;800&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=39">
</head>
<body>
  <div id="conn" class="conn-banner hidden" role="status"></div>

  <form id="login" class="login">
    <h1>Host remote</h1>
    <input id="password" type="password" placeholder="Presenter password" autocomplete="current-password" aria-label="Presenter password" autofocus>
    <button class="btn plastic" type="submit">Take control</button>
    <div id="loginError" class="error" role="alert"></div>
  </form>

  <main id="app" class="phone remote hidden" aria-live="polite"></main>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="/js/common.js?v=39"></script>
  <script src="/js/host.js?v=39"></script>
</body>
</html>
